# Nightly encrypted database backup, kept as a private workflow artifact for 14 days.
# Repository secrets needed: DATABASE_URL (a READ-capable connection string) and BACKUP_PASSPHRASE (long random text — store it safely!).
# pg_dump must be the same major version as (or newer than) your database; adjust the install step if your host runs a newer Postgres.
name: Nightly backup
on:
  schedule:
    - cron: "17 1 * * *"
  workflow_dispatch:
jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install a current PostgreSQL client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsS -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"
      - name: Dump and encrypt
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
        run: scripts/backup.sh
      - uses: actions/upload-artifact@v4
        with:
          name: uva-backup
          path: backups/*.enc
          retention-days: 14
